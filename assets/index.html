<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal AI Agent</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6c63ff;
      --accent2: #4ecdc4;
      --text: #e8eaf6;
      --text-dim: #8b8fa8;
      --success: #4caf50;
      --warn: #ff9800;
      --error: #f44336;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: transparent;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #app {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    /* ── Title Bar ──────────────────────────────── */
    #titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: move;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    #titlebar .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
    }

    #titlebar .logo .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .win-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .win-btn:hover { filter: brightness(1.3); }
    .win-btn.close { background: #ff5f57; }
    .win-btn.minimize { background: #febc2e; }
    .win-btn.hide { background: #28c840; }

    /* ── Context Bar ────────────────────────────── */
    #context-bar {
      padding: 8px 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    #context-info {
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    #context-info span { color: var(--text); font-weight: 500; }

    #refresh-ctx-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    #refresh-ctx-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Mode Selector ──────────────────────────── */
    #mode-bar {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #mode-bar::-webkit-scrollbar { display: none; }

    .mode-btn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--text); }
    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ── Main Content ───────────────────────────── */
    #main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #main::-webkit-scrollbar { width: 5px; }
    #main::-webkit-scrollbar-track { background: transparent; }
    #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Response Card ──────────────────────────── */
    #response-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      min-height: 120px;
      font-size: 13px;
      line-height: 1.6;
      position: relative;
    }

    #response-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    #response-text code {
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      color: var(--accent2);
    }

    #response-text pre {
      background: var(--surface2);
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border-left: 3px solid var(--accent);
    }

    #response-text pre code {
      background: none;
      padding: 0;
      color: #e8eaf6;
    }

    /* Placeholder */
    .placeholder {
      color: var(--text-dim);
      text-align: center;
      padding: 30px 0;
      font-size: 12px;
    }
    .placeholder .big { font-size: 36px; margin-bottom: 10px; }

    /* Loading spinner */
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 13px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Response Actions ───────────────────────── */
    #response-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .action-btn.primary:hover { filter: brightness(1.1); }
    .action-btn.danger { border-color: var(--error); color: var(--error); }

    /* ── OCR Preview ────────────────────────────── */
    #ocr-preview {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: var(--text-dim);
      max-height: 80px;
      overflow-y: auto;
      display: none;
    }
    #ocr-preview.visible { display: block; }
    #ocr-preview .label { color: var(--accent2); font-weight: 600; margin-bottom: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Prompt Input ───────────────────────────── */
    #input-area {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 8px 12px;
      resize: none;
      font-family: var(--font);
      height: 38px;
      transition: border-color 0.2s;
      outline: none;
    }
    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--text-dim); }

    #analyze-btn {
      padding: 8px 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #analyze-btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
    #analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Status ─────────────────────────────────── */
    #status-bar {
      padding: 4px 14px 8px;
      font-size: 10px;
      color: var(--text-dim);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #status-bar .status-ok { color: var(--success); }
    #status-bar .status-err { color: var(--error); }

    /* ── Toast ──────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <!-- Title Bar -->
  <div id="titlebar">
    <div class="logo">
      <div class="dot"></div>
      AI Agent
    </div>
    <div class="win-controls">
      <button class="win-btn minimize" title="Minimize" onclick="aiAgent.minimize()"></button>
      <button class="win-btn hide" title="Hide to Tray" onclick="aiAgent.hide()"></button>
      <button class="win-btn close" title="Quit" onclick="aiAgent.close()"></button>
    </div>
  </div>

  <!-- Context Bar -->
  <div id="context-bar">
    <div id="context-info">No context yet</div>
    <button id="refresh-ctx-btn" onclick="loadContext()">⟳ Refresh</button>
  </div>

  <!-- Mode Selector -->
  <div id="mode-bar">
    <button class="mode-btn active" data-mode="explain" onclick="setMode(this)">Explain</button>
    <button class="mode-btn" data-mode="summarize" onclick="setMode(this)">Summarize</button>
    <button class="mode-btn" data-mode="teach" onclick="setMode(this)">Teach Me</button>
    <button class="mode-btn" data-mode="code-review" onclick="setMode(this)">Code Review</button>
    <button class="mode-btn" data-mode="coding-practice" onclick="setMode(this)">Practice</button>
  </div>

  <!-- Main Content -->
  <div id="main">
    <div id="response-card">
      <div id="response-text">
        <div class="placeholder">
          <div class="big">🤖</div>
          <div>Press <strong>Ctrl+Shift+A</strong> to analyze your screen</div>
          <div style="margin-top:6px; font-size:11px;">or type a prompt below</div>
        </div>
      </div>
    </div>

    <div id="ocr-preview">
      <div class="label">📄 Captured Text</div>
      <div id="ocr-text-preview"></div>
    </div>

    <div id="response-actions" style="display:none;">
      <button class="action-btn" onclick="copyResponse()">📋 Copy</button>
      <button class="action-btn" onclick="clearResponse()">✕ Clear</button>
      <button class="action-btn" onclick="showHistory()">📜 History</button>
    </div>
  </div>

  <!-- Input Area -->
  <div id="input-area">
    <textarea id="user-input" placeholder="Ask something about your screen… (Enter to send)" rows="1"
      onkeydown="handleKey(event)"></textarea>
    <button id="analyze-btn" onclick="analyze()">Analyze ↵</button>
  </div>

  <!-- Status Bar -->
  <div id="status-bar">
    <span id="status-text">Ready · Ctrl+Shift+A to analyze</span>
    <span id="api-status">⬤ API</span>
  </div>

</div>

<div id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let currentMode = 'explain';
  let currentContext = null;
  let lastOCRText = '';
  let isAnalyzing = false;

  // ── Boot ───────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    await loadContext();
    checkAPIKey();

    // Register main-process events
    aiAgent.on('trigger-analyze', () => analyze());
    aiAgent.on('trigger-capture', () => captureOnly());
    aiAgent.on('trigger-refresh', () => loadContext());
    aiAgent.on('history-cleared', () => { toast('History cleared'); });
  });

  // ── Context ────────────────────────────────────────────────────────────
  async function loadContext() {
    const ctx = await aiAgent.getContext();
    currentContext = ctx;
    const el = document.getElementById('context-info');
    if (ctx.app !== 'Unknown') {
      el.innerHTML = `App: <span>${ctx.app}</span> · <span>${truncate(ctx.title, 40)}</span>`;
    } else {
      el.textContent = 'Could not detect active window';
    }
  }

  // ── Mode ───────────────────────────────────────────────────────────────
  function setMode(btn) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
  }

  // ── Analyze ────────────────────────────────────────────────────────────
  async function analyze() {
    if (isAnalyzing) return;
    isAnalyzing = true;

    const userPrompt = document.getElementById('user-input').value.trim();
    setStatus('Capturing screen…', false);
    showLoading('Capturing screen…');
    setAnalyzeDisabled(true);

    try {
      // 1. Refresh context
      await loadContext();

      // 2. Capture screen
      const captureResult = await aiAgent.captureScreen('fullscreen');
      if (!captureResult.success) throw new Error('Capture failed: ' + captureResult.error);

      setStatus('Running OCR…', false);
      showLoading('Extracting text from screen…');

      // 3. OCR
      const ocrResult = await aiAgent.runOCR(captureResult.path);
      if (ocrResult.success && ocrResult.text) {
        lastOCRText = ocrResult.text;
        showOCRPreview(ocrResult.text);
      }

      setStatus('Asking AI…', false);
      showLoading('Getting AI response…');

      // 4. LLM
      const context = { ...currentContext, ocrText: lastOCRText };
      const llmResult = await aiAgent.askLLM({ context, mode: currentMode, userPrompt });

      if (!llmResult.success) throw new Error(llmResult.error);

      showResponse(llmResult.response);
      setStatus('Done ✓', true);
      document.getElementById('user-input').value = '';

    } catch (err) {
      showError(err.message);
      setStatus('Error: ' + err.message.slice(0, 50), false);
    } finally {
      isAnalyzing = false;
      setAnalyzeDisabled(false);
    }
  }

  async function captureOnly() {
    setStatus('Capturing…', false);
    showLoading('Capturing…');
    const res = await aiAgent.captureScreen('fullscreen');
    if (res.success) {
      const ocr = await aiAgent.runOCR(res.path);
      lastOCRText = ocr.text || '';
      showOCRPreview(lastOCRText);
      setStatus('Captured ✓', true);
    }
  }

  // ── UI Helpers ─────────────────────────────────────────────────────────
  function showLoading(msg) {
    document.getElementById('response-text').innerHTML =
      `<div class="loading"><div class="spinner"></div>${msg}</div>`;
    document.getElementById('response-actions').style.display = 'none';
  }

  function showResponse(text) {
    document.getElementById('response-text').innerHTML = renderMarkdown(text);
    document.getElementById('response-actions').style.display = 'flex';
  }

  function showError(msg) {
    document.getElementById('response-text').innerHTML =
      `<div style="color:var(--error)">❌ ${escapeHtml(msg)}</div>`;
    document.getElementById('response-actions').style.display = 'flex';
  }

  function showOCRPreview(text) {
    const el = document.getElementById('ocr-preview');
    document.getElementById('ocr-text-preview').textContent = text.slice(0, 300) + (text.length > 300 ? '…' : '');
    el.classList.add('visible');
  }

  function clearResponse() {
    document.getElementById('response-text').innerHTML =
      `<div class="placeholder"><div class="big">🤖</div><div>Ready to analyze</div></div>`;
    document.getElementById('response-actions').style.display = 'none';
    document.getElementById('ocr-preview').classList.remove('visible');
    lastOCRText = '';
  }

  async function copyResponse() {
    const text = document.getElementById('response-text').innerText;
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard!');
  }

  async function showHistory() {
    const history = await aiAgent.getHistory(10);
    if (!history.length) { toast('No history yet'); return; }

    let html = '<div style="font-size:11px;">';
    for (const h of history) {
      const date = new Date(h.timestamp).toLocaleTimeString();
      html += `<div style="border-bottom:1px solid var(--border);padding:8px 0;">
        <div style="color:var(--text-dim)">${date} · ${h.mode} · ${h.app_name}</div>
        <div style="margin-top:4px">${escapeHtml(h.response.slice(0, 150))}…</div>
      </div>`;
    }
    html += '</div>';
    document.getElementById('response-text').innerHTML = html;
  }

  function setStatus(msg, ok) {
    const el = document.getElementById('status-text');
    el.textContent = msg;
    el.className = ok ? 'status-ok' : '';
  }

  function setAnalyzeDisabled(v) {
    document.getElementById('analyze-btn').disabled = v;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      analyze();
    }
  }

  async function checkAPIKey() {
    const el = document.getElementById('api-status');
    // Simple heuristic: if no key configured, show warning
    try {
      el.style.color = 'var(--success)';
    } catch {
      el.style.color = 'var(--error)';
      el.textContent = '⬤ No API Key';
    }
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── Markdown renderer (lightweight) ───────────────────────────────────
  function renderMarkdown(text) {
    return escapeHtml(text)
      .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
        `<pre><code class="lang-${lang}">${code.trimEnd()}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/^### (.+)$/gm, '<h4 style="color:var(--accent2);margin:10px 0 4px">$1</h4>')
      .replace(/^## (.+)$/gm, '<h3 style="color:var(--accent);margin:12px 0 6px">$1</h3>')
      .replace(/^# (.+)$/gm, '<h2 style="color:var(--accent);margin:14px 0 8px">$1</h2>')
      .replace(/^[-*] (.+)$/gm, '<li style="margin:2px 0 2px 16px">$1</li>')
      .replace(/\n/g, '<br>');
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function truncate(str, n) {
    return str.length > n ? str.slice(0, n) + '…' : str;
  }
</script>
</body>
</html>
